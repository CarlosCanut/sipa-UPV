name: sipa-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: sipa-frontend
    command: [node, deploy/migrate.mjs]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: frontend
    env_file: ${SIPA_ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: "no"
  backend:
    build: ./backend
    environment:
      BACKEND_TOKEN: ${BACKEND_TOKEN:?Set BACKEND_TOKEN}
      USE_PLACEHOLDER_ALGORITHM: ${USE_PLACEHOLDER_ALGORITHM:-true}
      EXTERNAL_ALGORITHM_URL: ${EXTERNAL_ALGORITHM_URL:-}
      EXTERNAL_ALGORITHM_TOKEN: ${EXTERNAL_ALGORITHM_TOKEN:-}
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    image: sipa-frontend
    build:
      context: .
      dockerfile: web/Dockerfile
      target: frontend
    env_file: ${SIPA_ENV_FILE:-.env}
    environment:
      HOSTNAME: "::"
      PORT: 3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  checks:
    profiles: [checks]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: checks
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
  caddy_config:
